spring.application.name=ecom-proj

# Local DB credentials (gitignored). Real environment variables still take precedence.
spring.config.import=optional:classpath:secrets.properties

# 1. Conexión a la Base de Datos MySQL
# Asegúrate de que la base de datos 'ecomdb' esté creada en tu phpMyAdmin
# TiDB Cloud (TLS required). Credentials come from environment variables, never hardcode them.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:4000}/${DB_NAME:sys}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configuración de Hibernate / JPA
# Muestra en consola las consultas SQL que Spring hace de fondo
spring.jpa.show-sql=true
# 'update' crea las tablas automáticamente si no existen basadas en tus clases de Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 3. Desactivar H2 y Scripts Automáticos (Para evitar errores de arranque)
spring.h2.console.enabled=false
spring.sql.init.mode=never
# Permitir subida de imágenes pesadas sin que Spring las bloquee
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

